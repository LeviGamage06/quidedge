    <script>
        // 1. Maximum Frontend Security Shield
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.key === 'F12') e.preventDefault();
            if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j')) e.preventDefault();
            if (e.ctrlKey && (e.key === 'U' || e.key === 'u' || e.key === 'S' || e.key === 's' || e.key === 'P' || e.key === 'p')) e.preventDefault();
        });

        // 🚀 Booking Form Functions
        function openBookingModal() {
            const modal = document.getElementById('booking-modal');
            modal.style.display = 'flex';
            setTimeout(() => {
                modal.classList.add('active');
            }, 10);
            document.body.style.overflow = 'hidden';
        }

        function closeBookingModal() {
            const modal = document.getElementById('booking-modal');
            modal.classList.remove('active');
            setTimeout(() => {
                modal.style.display = 'none';
            }, 400);
            document.body.style.overflow = 'auto';
        }

        document.addEventListener("DOMContentLoaded", function() {
            // 2. Smooth reveal animation for sections on scroll
            const revealObserver = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                        observer.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.1, rootMargin: "0px 0px -50px 0px" });

            document.querySelectorAll('.reveal-element').forEach(el => {
                revealObserver.observe(el);
            });

            // 3. Smart Video Loading
            const videoObserver = new IntersectionObserver(entries => {
                entries.forEach(entry => {
                    const video = entry.target;
                    if (entry.isIntersecting) {
                        video.play().catch(e => console.log("Autoplay blocked"));
                    } else {
                        video.pause();
                    }
                });
            }, { threshold: 0.2 });

            document.querySelectorAll('.lazy-video').forEach(video => {
                videoObserver.observe(video);
            });

            // 🚀 Initialize intl-tel-input
            const whatsappInput = document.querySelector("#whatsapp");
            let iti;
            if(whatsappInput) {
                iti = window.intlTelInput(whatsappInput, {
                    initialCountry: "auto",
                    geoIpLookup: callback => {
                        fetch("https://ipapi.co/json")
                            .then(res => res.json())
                            .then(data => callback(data.country_code))
                            .catch(() => callback("lk")); 
                    },
                    utilsScript: "https://cdn.jsdelivr.net/npm/intl-tel-input@19.2.16/build/js/utils.js",
                    separateDialCode: true 
                });
            }

            // 🚀 Form Submit Event with Validation
            const form = document.getElementById('bookingForm');
            const whatsappError = document.getElementById('whatsappError');

            if(form) {
                form.addEventListener('submit', e => {
                    e.preventDefault();
                    
                    if (!form.checkValidity()) {
                        form.reportValidity();
                        return;
                    }

                    const whatsappVal = whatsappInput.value.trim();
                    const submitBtn = form.querySelector('button[type="submit"]');

                    // Validation for Optional field
                    if (whatsappVal !== "" && !iti.isValidNumber()) {
                        whatsappError.style.display = "block";
                        whatsappInput.style.borderColor = "#ff4444";
                        return;
                    } else {
                        whatsappError.style.display = "none";
                        whatsappInput.style.borderColor = "#333";
                    }

                    submitBtn.innerHTML = 'Submitting...';
                    submitBtn.disabled = true;
                    
                    // Get formatted number and add single quote for Google Sheets
                    let fullPhoneNumber = whatsappVal !== "" ? iti.getNumber(intlTelInputUtils.numberFormat.INTERNATIONAL) : "";
                    if (fullPhoneNumber) {
                        fullPhoneNumber = "'" + fullPhoneNumber;
                    }

                    const formData = new FormData();
                    formData.append('fullName', document.getElementById('fullName').value);
                    formData.append('email', document.getElementById('email').value);
                    
                    // Sending to both columns
                    formData.append('phone', fullPhoneNumber); 
                    formData.append('whatsapp', fullPhoneNumber);
                    
                    formData.append('revenue', document.getElementById('revenue').value);
                    formData.append('consent1', document.getElementById('consent1').checked);
                    formData.append('consent2', document.getElementById('consent2').checked);

                    // අර පරණ Google Apps Script URL එකමයි
                    const scriptURL = 'https://script.google.com/macros/s/AKfycbyP2WNh0sp45wjqh_hoZYXvqL48VQIChpzivHRY1nT9mCGgHFG1lVPSUGrDMRZ6KlsV/exec';

                    fetch(scriptURL, { method: 'POST', body: formData })
                        .then(response => {
                            document.getElementById('formStatus').style.display = 'block';
                            form.reset();
                            submitBtn.innerHTML = 'Submit Application';
                            submitBtn.disabled = false;
                            
                            setTimeout(() => {
                                closeBookingModal();
                                document.getElementById('formStatus').style.display = 'none';
                            }, 3000);

                        .catch(error => {
                            console.error('Error!', error.message);
                            submitBtn.innerHTML = 'Submit Application';
                            submitBtn.disabled = false;
                            alert("Something went wrong. Please try again.");

                });
